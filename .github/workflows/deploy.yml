name: Deploy

# Builds the site and deploys it to Cloudflare (Workers static assets, see wrangler.jsonc).
# The build pulls the TAKwerx Market's live catalog and compiles each plugin's manual,
# so the generated files (public/manuals, public/plugin-assets, src/data/plugins.json)
# never live in git. The schedule picks up new plugin releases without a push.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Cloudflare secrets live in this environment, which only `main` may use,
    # so workflows on other branches (e.g. takwerx-agent's claude/* PR branches) can't read them.
    environment: production
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      COMMUNITY_TOKEN: ${{ secrets.COMMUNITY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same Typst the plugin builds use to put the manual inside the APK.
      - name: Install Typst
        run: |
          D="$RUNNER_TEMP/typst-x86_64-unknown-linux-musl"
          mkdir -p "$D"
          # GitHub release first; if github.com downloads are down, take the same binary from Typst's official image.
          if ! curl -fsSL --retry 3 https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ -C "$RUNNER_TEMP"; then
            echo "Release download failed; using ghcr.io/typst/typst:v0.13.1"
            cid=$(docker create ghcr.io/typst/typst:v0.13.1)
            docker cp "$cid:/bin/typst" "$D/typst"
            docker rm "$cid"
          fi
          echo "$D" >> "$GITHUB_PATH"
          "$D/typst" --version

      - run: npm ci

      - name: Build (syncs plugins, then astro build)
        run: npm run build


      - name: Deploy to Cloudflare
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.158.0'
          command: deploy
